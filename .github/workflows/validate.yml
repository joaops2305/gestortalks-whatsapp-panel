name: Validate

on:
  push:
    branches:
      - main
      - agent/initial-panel
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3002
        run: npm run build
